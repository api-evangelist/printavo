meters:
- name: plan_subscription
  description: Monthly Printavo plan subscription (Lite, Standard, or Premium). Premium is the only tier with API access.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: additional_users
  description: Seats beyond the plan's included users, billed at $19/month each on Premium.
  unit: users
  aggregation: sum
  dimensions:
  - account
- name: automations
  description: Automation packs beyond the included allotment (additional 30 automations for $15/month).
  unit: packs
  aggregation: sum
  dimensions:
  - account
- name: merch_addon
  description: Printavo Merch online-store add-on at $109/month.
  unit: months
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the monthly plan tier, seat count, automation packs, and Merch add-on; API calls themselves carry no separate charge.
- name: Allocation
  description: Attribute the Premium subscription premium to the teams/integrations that actually require API access.
- name: Optimization
  description: Only step up to Premium when API access, Power Scheduler, or PO workflows are genuinely needed; right-size seats and automation packs; stay within the 10-requests-per-5-seconds limit to avoid retries rather than for cost.
- name: Accountability
  description: Assign an owner for the Printavo subscription and review seat/add-on growth against actual usage each billing cycle.
