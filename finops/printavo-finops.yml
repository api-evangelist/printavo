description: >-
  FinOps view of Printavo spend. Printavo is a fixed monthly SaaS subscription,
  not a usage-metered API. The dominant cost is the plan tier (Lite $109,
  Standard $244, Premium quote-based) plus optional add-ons (extra users at
  $19/month, additional automations, and the Printavo Merch store add-on at
  $109/month). API v2 (GraphQL) access is a FEATURE of the Premium tier and is
  not billed per call - there is no per-request charge, only a 10-requests-per-5-seconds
  rate limit. Therefore the API cost is effectively the delta to reach Premium
  rather than metered consumption.
notes: >-
  There is no consumption-based API meter to model in FOCUS terms; API access is
  bundled into the Premium subscription. The meters below track subscription and
  seat costs, which are the real cost drivers. Verify current prices on the
  Printavo pricing page during reconciliation.
