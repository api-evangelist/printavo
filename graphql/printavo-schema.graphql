"""
Printavo API v2 GraphQL Schema (partial, grounded)

Printavo API v2 is a NATIVE GraphQL API. This schema is a grounded subset of the
public schema documented at https://www.printavo.com/docs/api/v2, focused on the
core objects covered by this catalog: Orders (Quotes + Invoices), Customers and
Contacts, Line Items, Statuses, Tasks, Payments, and Merch.

Endpoint:  https://www.printavo.com/api/v2   (single POST GraphQL endpoint)
Auth:      request headers `email` and `token` (API token from the My Account
           page); Content-Type: application/json. Premium-tier plan required.
Limits:    10 requests / 5 seconds per email or IP; query complexity limit
           25000; maximum query depth 13. Connections paginate 25 per page by
           default via cursor args (first, last, after, before).

Field names and types below follow the published object reference. Objects that
were not individually inspected are modeled from the documented operation and
object lists and are marked as such; treat this file as an honest model of the
live schema, not a verbatim introspection dump.
"""

# ─────────────────────────────────────────────
# Scalars (as used by Printavo)
# ─────────────────────────────────────────────

scalar ISO8601DateTime
scalar ISO8601Date

# ─────────────────────────────────────────────
# Interfaces
# ─────────────────────────────────────────────

interface IDed {
  id: ID!
}

interface Timestamps {
  timestamps: ObjectTimestamps!
}

type ObjectTimestamps {
  createdAt: ISO8601DateTime!
  updatedAt: ISO8601DateTime!
}

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum StatusType {
  QUOTE
  INVOICE
  MERCH
  TASK
}

enum SortDirection {
  ASCENDING
  DESCENDING
}

# ─────────────────────────────────────────────
# Order union (Quotes + Invoices)
# ─────────────────────────────────────────────

"An Order is the union of Quote and Invoice documents."
union OrderUnion = Quote | Invoice

"Object a Task can be attached to."
union TaskableUnion = Quote | Invoice

# ─────────────────────────────────────────────
# Quote (grounded from object/quote)
# ─────────────────────────────────────────────

type Quote implements IDed & Timestamps {
  id: ID!
  visualId: ID
  nickname: String
  publicHash: String!
  createdAt: ISO8601Date!
  startAt: ISO8601DateTime!
  dueAt: ISO8601DateTime!
  customerDueAt: ISO8601Date!
  paymentDueAt: ISO8601Date!
  invoiceAt: ISO8601Date!
  subtotal: Float
  total: Float
  totalUntaxed: Float
  discount: Float
  discountAmount: Float
  discountAsPercentage: Boolean
  salesTax: Float
  salesTaxAmount: Float
  amountPaid: Float
  amountOutstanding: Float
  paidInFull: Boolean!
  totalQuantity: Int
  contact: Contact!
  owner: User
  status: Status!
  deliveryMethod: DeliveryMethod
  paymentTerm: PaymentTerm
  paymentRequest: PaymentRequest
  billingAddress: CustomerAddress
  shippingAddress: CustomerAddress
  customerNote: String
  productionNote: String
  visualPoNumber: String
  tags: [String!]
  url: String!
  publicUrl: String!
  publicPdf: String!
  packingSlipUrl: String!
  workorderUrl: String!
  merch: Boolean!
  lineItemGroups(first: Int, last: Int, after: String, before: String): LineItemGroupConnection
  tasks(first: Int, last: Int, after: String, before: String): TaskConnection
  timestamps: ObjectTimestamps!
}

# ─────────────────────────────────────────────
# Invoice (modeled - a Quote converted to a billable order; shares Quote shape)
# ─────────────────────────────────────────────

type Invoice implements IDed & Timestamps {
  id: ID!
  visualId: ID
  nickname: String
  publicHash: String!
  createdAt: ISO8601Date!
  dueAt: ISO8601DateTime!
  customerDueAt: ISO8601Date!
  paymentDueAt: ISO8601Date!
  subtotal: Float
  total: Float
  totalUntaxed: Float
  amountPaid: Float
  amountOutstanding: Float
  paidInFull: Boolean!
  totalQuantity: Int
  contact: Contact!
  owner: User
  status: Status!
  deliveryMethod: DeliveryMethod
  paymentTerm: PaymentTerm
  paymentRequest: PaymentRequest
  billingAddress: CustomerAddress
  shippingAddress: CustomerAddress
  customerNote: String
  productionNote: String
  visualPoNumber: String
  tags: [String!]
  url: String!
  publicUrl: String!
  merch: Boolean!
  lineItemGroups(first: Int, last: Int, after: String, before: String): LineItemGroupConnection
  timestamps: ObjectTimestamps!
}

# ─────────────────────────────────────────────
# Customer & Contact (grounded from object/customer)
# ─────────────────────────────────────────────

type Customer implements IDed & Timestamps {
  id: ID!
  companyName: String
  primaryContact: Contact
  billingAddress: CustomerAddress
  shippingAddress: CustomerAddress
  owner: User
  orderCount: Int
  salesTax: Float
  taxExempt: Boolean
  defaultPaymentTerm: PaymentTerm
  resaleNumber: String
  internalNote: String
  contacts(first: Int, last: Int, after: String, before: String): ContactConnection
  orders(first: Int, last: Int, after: String, before: String): OrderConnection
  reminders(first: Int, last: Int, after: String, before: String): TaskConnection
  timestamps: ObjectTimestamps!
}

type Contact implements IDed & Timestamps {
  id: ID!
  fullName: String
  firstName: String
  lastName: String
  email: String
  phone: String
  customer: Customer
  orderCount: Int
  timestamps: ObjectTimestamps!
}

type CustomerAddress {
  id: ID
  companyName: String
  customerName: String
  address1: String
  address2: String
  city: String
  state: String
  zipCode: String
  country: String
}

# ─────────────────────────────────────────────
# Line Items (grounded from object/lineitem)
# ─────────────────────────────────────────────

type LineItem implements IDed & Timestamps {
  id: ID!
  itemNumber: String
  position: Int
  product: String
  category: String
  color: String
  description: String
  items: Int
  price: Float
  markupPercentage: Float
  taxed: Boolean
  merch: Boolean!
  productStatus: Status
  personalizations: [Personalization!]
  sizes: [LineItemSize!]
  lineItemGroup: LineItemGroup
  priceReceipt: LineItemPriceReceipt
  mockups(first: Int, last: Int, after: String, before: String): MockupConnection
