  pricingMatrixColumn: String
  timestamps: ObjectTimestamps!
}

type Mockup {
  id: ID!
  url: String
  position: Int
}

type Fee implements IDed & Timestamps {
  id: ID!
  description: String
  amount: Float
  taxable: Boolean
  timestamps: ObjectTimestamps!
}

# ─────────────────────────────────────────────
# Status (grounded from object/status)
# ─────────────────────────────────────────────

type Status implements IDed & Timestamps {
  id: ID!
  name: String!
  color: String
  type: StatusType!
  position: Int
  timestamps: ObjectTimestamps!
}

# ─────────────────────────────────────────────
# Task (grounded from object/task)
# ─────────────────────────────────────────────

type Task implements IDed & Timestamps {
  id: ID!
  name: String!
  completed: Boolean!
  completedAt: ISO8601DateTime
  completedBy: User
  dueAt: ISO8601DateTime!
  assignedTo: User
  taskable: TaskableUnion
  sourcePresetTaskGroupTitle: String
  timestamps: ObjectTimestamps!
}

type ApprovalRequest implements IDed & Timestamps {
  id: ID!
  approved: Boolean!
  approvedAt: ISO8601DateTime
