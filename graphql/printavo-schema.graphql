# ─────────────────────────────────────────────
# Query Root (grounded from operation/query)
# ─────────────────────────────────────────────

type Query {
  "The authenticated account."
  account: Account!

  "The authenticated user."
  user: User!

  "Retrieve a single customer by id."
  customer(id: ID!): Customer
  "List customers."
  customers(first: Int, last: Int, after: String, before: String): CustomerConnection!

  "Retrieve a single contact by id."
  contact(id: ID!): Contact
  "List contacts."
  contacts(first: Int, last: Int, after: String, before: String, sortOn: String, sortDescending: Boolean): ContactConnection!

  "Retrieve a single order (Quote or Invoice) by id."
  order(id: ID!): OrderUnion
  "List orders - the union of quotes and invoices - filterable by production dates and statuses."
  orders(first: Int, last: Int, after: String, before: String, statusIds: [ID!], sortOn: String, sortDescending: Boolean): OrderConnection!

  "Retrieve a single quote by id."
  quote(id: ID!): Quote
  "List quotes."
  quotes(first: Int, last: Int, after: String, before: String): QuoteConnection!

  "Retrieve a single invoice by id."
  invoice(id: ID!): Invoice
  "List invoices."
  invoices(first: Int, last: Int, after: String, before: String): InvoiceConnection!

  "Retrieve a single line item by id."
  lineItem(id: ID!): LineItem
  "Retrieve a single line item group by id."
  lineItemGroup(id: ID!): LineItemGroup

  "Retrieve a single status by id."
  status(id: ID!): Status
  "List statuses."
  statuses(first: Int, last: Int, after: String, before: String, type: StatusType): StatusConnection!

  "Retrieve a single task by id."
  task(id: ID!): Task
  "List tasks."
  tasks(first: Int, last: Int, after: String, before: String, sortOn: String, sortDescending: Boolean): TaskConnection!

  "List payment requests."
  paymentRequests(first: Int, last: Int, after: String, before: String): [PaymentRequest!]!

  "Retrieve a single transaction by id."
  transaction(id: ID!): Transaction
  "List transactions."
  transactions(first: Int, last: Int, after: String, before: String): TransactionConnection!

  "Retrieve a single merch order by id."
  merchOrder(id: ID!): MerchOrder
  "Retrieve a single merch store by id."
  merchStore(id: ID!): MerchStore
  "List merch stores."
  merchStores(first: Int, last: Int, after: String, before: String): MerchStoreConnection!
}

type Account implements IDed & Timestamps {
  id: ID!
  companyName: String
  email: String
  timestamps: ObjectTimestamps!
}

# ─────────────────────────────────────────────
# Mutation Root (grounded from operation/mutation)
# ─────────────────────────────────────────────

type Mutation {
  "Authenticate and return an API token."
  login(email: String!, password: String!, deviceName: String, deviceToken: String): String
  "Invalidate the current session token."
  logout: Boolean

  quoteCreate(input: QuoteCreateInput!): Quote
  quoteUpdate(id: ID!, input: QuoteUpdateInput!): Quote
  quoteDelete(id: ID!): Quote
  quoteDuplicate(id: ID!): Quote

  invoiceUpdate(id: ID!, input: InvoiceUpdateInput!): Invoice
  invoiceDelete(id: ID!): Invoice
  invoiceDuplicate(id: ID!): Invoice

  customerCreate(input: CustomerCreateInput!): Customer
  customerUpdate(id: ID!, input: CustomerUpdateInput!): Customer
  customerDelete(id: ID!): Customer

  contactCreate(input: ContactCreateInput!): Contact
  contactUpdate(id: ID!, input: ContactUpdateInput!): Contact
  contactDelete(id: ID!): Contact

  lineItemCreate(input: LineItemInput!): LineItem
  lineItemCreates(input: [LineItemInput!]!): [LineItem!]
  lineItemUpdate(id: ID!, input: LineItemInput!): LineItem
  lineItemUpdates(ids: [ID!]!, input: [LineItemInput!]!): [LineItem!]
  lineItemDelete(id: ID!): LineItem
  lineItemDeletes(ids: [ID!]!): [LineItem!]

  lineItemGroupCreate(input: LineItemGroupInput!): LineItemGroup
  lineItemGroupCreates(input: [LineItemGroupInput!]!): [LineItemGroup!]
  lineItemGroupUpdate(id: ID!, input: LineItemGroupInput!): LineItemGroup
  lineItemGroupUpdates(ids: [ID!]!, input: [LineItemGroupInput!]!): [LineItemGroup!]
  lineItemGroupDelete(id: ID!): LineItemGroup
  lineItemGroupDeletes(ids: [ID!]!): [LineItemGroup!]

  imprintCreate(input: ImprintInput!): Imprint
  imprintCreates(input: [ImprintInput!]!): [Imprint!]
  imprintUpdate(id: ID!, input: ImprintInput!): Imprint
  imprintUpdates(ids: [ID!]!, input: [ImprintInput!]!): [Imprint!]
  imprintDelete(id: ID!): Imprint
  imprintDeletes(ids: [ID!]!): [Imprint!]

  feeCreate(input: FeeInput!): Fee
  feeCreates(input: [FeeInput!]!): [Fee!]
  feeUpdate(id: ID!, input: FeeInput!): Fee
  feeUpdates(ids: [ID!]!, input: [FeeInput!]!): [Fee!]
  feeDelete(id: ID!): Fee
  feeDeletes(ids: [ID!]!): [Fee!]

  statusUpdate(input: StatusUpdateInput!): Status

  taskCreate(input: TaskInput!): Task
  taskUpdate(id: ID!, input: TaskUpdateInput!): Task
  taskDelete(id: ID!): Task

  approvalRequestCreate(parentId: ID!): ApprovalRequest
  approvalRequestApprove(id: ID!): ApprovalRequest
  approvalRequestUnapprove(id: ID!): ApprovalRequest
  approvalRequestRevoke(id: ID!): ApprovalRequest

  transactionPaymentCreate(input: TransactionPaymentInput!): Transaction
  transactionPaymentUpdate(id: ID!, input: TransactionPaymentInput!): Transaction
  transactionPaymentDelete(id: ID!): Transaction
}
