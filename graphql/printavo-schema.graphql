}
type InvoiceEdge {
  cursor: String!
  node: Invoice!
}

type CustomerConnection {
  edges: [CustomerEdge!]!
  pageInfo: PageInfo!
  totalNodes: Int
}
type CustomerEdge {
  cursor: String!
  node: Customer!
}

type ContactConnection {
  edges: [ContactEdge!]!
  pageInfo: PageInfo!
  totalNodes: Int
}
type ContactEdge {
  cursor: String!
  node: Contact!
}

type LineItemConnection {
