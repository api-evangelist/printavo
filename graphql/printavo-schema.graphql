}

type LineItemGroup implements IDed & Timestamps {
  id: ID!
  position: Int
  lineItems(first: Int, last: Int, after: String, before: String): LineItemConnection
  imprints(first: Int, last: Int, after: String, before: String): ImprintConnection
  timestamps: ObjectTimestamps!
}

type Imprint implements IDed & Timestamps {
  id: ID!
  typeOfWork: String
