  timestamps: ObjectTimestamps!
}

# ─────────────────────────────────────────────
# Payments (modeled from documented operations)
# ─────────────────────────────────────────────

type Transaction implements IDed & Timestamps {
  id: ID!
  amount: Float!
  category: String
  transactedFor: OrderUnion
  timestamps: ObjectTimestamps!
}

type PaymentRequest implements IDed & Timestamps {
  id: ID!
