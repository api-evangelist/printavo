  - url: https://www.printavo.com/docs/api/v2/object/lineitem/
    type: APIReference
  - url: graphql/printavo-schema.graphql
    type: GraphQL
  - url: graphql/printavo-graphql.md
    type: GraphQL
  description: >-
    GraphQL surface for the products, garments, and decoration that make up an
    order. Query line items and line item groups, and create, update, or delete
    line items, line item groups, imprints, and fees - including batch variants
    such as lineItemCreates and lineItemUpdates.
- aid: printavo:printavo-statuses-api
  name: Printavo Statuses API
  tags:
  - Statuses
  - Workflow
  - Production
  - GraphQL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.printavo.com/docs/api/v2
  baseURL: https://www.printavo.com/api/v2
  properties:
  - url: https://www.printavo.com/docs/api/v2
    type: Documentation
  - url: https://www.printavo.com/docs/api/v2/object/status/
    type: APIReference
  - url: graphql/printavo-schema.graphql
    type: GraphQL
  - url: graphql/printavo-graphql.md
    type: GraphQL
  description: >-
    GraphQL surface for the production statuses that track an order through the
    shop. Query a single status or a statuses connection, and move an order
    between stages with the statusUpdate mutation. Each status carries a name,
    color, type, and position.
- aid: printavo:printavo-tasks-api
  name: Printavo Tasks API
  tags:
  - Tasks
  - Approvals
  - GraphQL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.printavo.com/docs/api/v2
  baseURL: https://www.printavo.com/api/v2
  properties:
  - url: https://www.printavo.com/docs/api/v2
    type: Documentation
  - url: https://www.printavo.com/docs/api/v2/object/task/
    type: APIReference
  - url: graphql/printavo-schema.graphql
    type: GraphQL
  - url: graphql/printavo-graphql.md
    type: GraphQL
  description: >-
    GraphQL surface for tasks and approval requests attached to quotes,
    invoices, and orders. Query single or plural tasks with sorting, and create,
    update, or delete tasks via taskCreate, taskUpdate, and taskDelete, plus
    manage artwork and quote approvals via the approvalRequest mutations.
- aid: printavo:printavo-payments-api
  name: Printavo Payments API
