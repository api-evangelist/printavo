  - url: graphql/printavo-schema.graphql
    type: GraphQL
  - url: graphql/printavo-graphql.md
    type: GraphQL
  description: >-
    GraphQL surface for payments and money movement. Query transactions,
    transaction details, and payment requests, and record, update, or delete
    payments via transactionPaymentCreate, transactionPaymentUpdate, and
    transactionPaymentDelete.
- aid: printavo:printavo-merch-api
